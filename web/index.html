<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="ESP32-alapú kapuvezérlő webes felülete.">
  <title>Kapuvezérlés</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">⌂</div>
      <span>Kapuvezérlés</span>
    </header>

    <section id="loginView" class="login-view" aria-labelledby="loginTitle">
      <div class="login-card">
        <h1 id="loginTitle">Bejelentkezés</h1>
        <form id="loginForm">
          <label for="email">E-mail-cím</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="nev@pelda.hu" required>

          <label for="password">Jelszó</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Jelszó" required>

          <button id="loginButton" class="primary-button" type="submit">Bejelentkezés</button>
          <p id="authMessage" class="message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="dashboardView" class="dashboard" hidden aria-labelledby="dashboardTitle">
      <div class="dashboard-topline">
        <h1 id="dashboardTitle">Kapuk</h1>
        <button id="logoutButton" class="text-button" type="button">Kijelentkezés</button>
      </div>

      <div class="device-status" role="status" aria-live="polite">
        <span id="deviceStatusDot" class="status-dot unknown" aria-hidden="true"></span>
        <span>ESP32:</span>
        <strong id="deviceStatusText">Állapot még nem érhető el</strong>
      </div>

      <div class="gate-list">
        <article class="gate-card">
          <div><span class="gate-number">01</span><h2>Első garázskapu</h2></div>
          <button class="gate-button" type="button" disabled>Nyitás / zárás</button>
        </article>
        <article class="gate-card">
          <div><span class="gate-number">02</span><h2>Második garázskapu</h2></div>
          <button class="gate-button" type="button" disabled>Nyitás / zárás</button>
        </article>
        <article class="gate-card">
          <div><span class="gate-number">03</span><h2>Bejárati kapu</h2></div>
          <button class="gate-button" type="button" disabled>Nyitás / zárás</button>
        </article>
      </div>
      <p class="note">A vezérlőgombok az ESP32-kommunikáció elkészültéig le vannak tiltva.</p>
    </section>

    <footer>ESP32 Gate Opener · Féléves projekt</footer>
  </main>
</body>
</html>
